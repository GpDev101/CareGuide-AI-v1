spring:
  application:
    name: careguide-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careguide}
    username: ${DB_USERNAME:careguide}
    password: ${DB_PASSWORD:change_me_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

info:
  app:
    name: CareGuide AI API
    description: Evidence-grounded knowledge assistant API
