services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: careguide-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careguide}
      POSTGRES_USER: ${POSTGRES_USER:-careguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - careguide_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careguide} -d ${POSTGRES_DB:-careguide}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  careguide_pgdata:
